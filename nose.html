<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Texto en toda la página</title>
    <style>
        /* Configuración del fondo y contenedor principal */
        body {
            background-color: #530404; /* Color de fondo oscuro */
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;

            /* Truco CSS para repetir el texto en rejilla */
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px; /* Espacio entre cada texto */
        }

        /* Estilo para cada uno de los textos */
        p {
            color: #ff5733; /* Color del texto (puedes cambiarlo) */
            font-family: 'Arial', sans-serif;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Copia esta línea de texto las veces que quieras para rellenar -->

    <p>Tu Texto</p>
    <p>Tu Texto</p>

    <p>Tu Texto</p>
    <p>Tu Texto</p>
    <p>Tu Texto</p>

</body>
</html>
